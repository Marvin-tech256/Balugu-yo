<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Planting — Balugu Yo</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header {
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      padding: 20px 24px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-header h1 {
      font-size: 20px;
      color: white;
    }

    .form-card {
      background: white;
      border-radius: 20px 20px 0 0;
      margin-top: -12px;
      padding: 28px 20px 100px;
      min-height: calc(100vh - 80px);
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 14px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Soil chips */
    .chip-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 10px 18px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .chip.selected {
      border-color: var(--primary);
      background: #E8F5E9;
      color: var(--primary);
    }

    /* Prediction result */
    .prediction-result {
      display: none;
      background: linear-gradient(135deg, #1B5E20, #00897B);
      border-radius: 20px;
      padding: 28px 24px;
      color: white;
      text-align: center;
      margin-top: 24px;
    }

    .prediction-result.show {
      display: block;
    }

    .pred-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }

    .pred-date {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pred-days {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 20px;
    }

    .pred-confidence {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .pred-basis {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .pred-actions {
      display: flex;
      gap: 10px;
    }

    .pred-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    .btn-save {
      background: white;
      color: var(--primary-dark);
    }

    .btn-new {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
    }

    /* Date input fix */
    input[type="date"] {
      color: var(--text);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Add New Planting</h1>
  </div>

  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Balugu <span>Yo</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="my-farms.html">
          <span class="nav-icon">🌾</span> My Farms
        </a>
        <a href="add-planting.html" class="active">
          <span class="nav-icon">🌱</span> Add Planting
        </a>
        <a href="weather.html">
          <span class="nav-icon">🌧️</span> Weather
        </a>
        <a href="alerts.html">
          <span class="nav-icon">🔔</span> Alerts
        </a>
      </nav>
      <div style="padding:20px;border-top:1px solid rgba(255,255,255,0.1)">
        <a href="#" onclick="logout()" style="color:rgba(255,255,255,0.6);font-size:13px">
          🚪 Logout
        </a>
      </div>
    </div>

    <div class="main-content">
      <div class="form-card" style="max-width:600px;margin:0 auto">

        <!-- FARM DETAILS -->
        <div class="section-label">🌾 Farm Details</div>

        <div class="form-group">
          <label>Select Farm</label>
          <select class="form-control" id="farm_id">
            <option value="">Loading your farms...</option>
          </select>
        </div>

        <!-- CROP DETAILS -->
        <div class="section-label">🌿 Crop Details</div>

        <div class="form-group">
          <label>Yam Variety</label>
          <select class="form-control" id="yam_variety">
            <option value="Local Balugu">Local Balugu</option>
            <option value="White Balugu">White Balugu</option>
            <option value="Yellow Balugu">Yellow Balugu</option>
            <option value="Giant Balugu">Giant Balugu</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Planting Date</label>
          <input type="date" class="form-control" id="planting_date" />
        </div>

        <div class="form-group">
          <label>Number of Mounds</label>
          <input type="number" class="form-control" id="number_of_mounds" placeholder="e.g. 50" min="1" />
        </div>

        <!-- SOIL TYPE -->
        <div class="section-label">🧱 Soil Type</div>

        <div class="form-group">
          <div class="chip-group" id="soilChips">
            <div class="chip selected" onclick="selectSoil('loam', this)">
              🟤 Loam
            </div>
            <div class="chip" onclick="selectSoil('clay', this)">
              🔴 Clay
            </div>
            <div class="chip" onclick="selectSoil('sandy', this)">
              🟡 Sandy
            </div>
          </div>
          <input type="hidden" id="soil_type" value="loam" />
        </div>

        <!-- NOTES -->
        <div class="section-label">📝 Additional Notes</div>

        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea class="form-control" id="notes" placeholder="Any additional information about this planting..."
            rows="3" style="resize:vertical"></textarea>
        </div>

        <!-- SUBMIT -->
        <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">
          🌿 Calculate Harvest Date
        </button>

        <!-- PREDICTION RESULT -->
        <div class="prediction-result" id="predictionResult">
          <div class="pred-label">🎯 Predicted Harvest Date</div>
          <div class="pred-date" id="predDate">—</div>
          <div class="pred-days" id="predDays">—</div>
          <div class="pred-confidence" id="predConfidence">—</div>
          <div class="pred-basis" id="predBasis">—</div>
          <div class="pred-actions">
            <button class="btn-save" onclick="goToDashboard()">
              ✅ Save & Go Home
            </button>
            <button class="btn-new" onclick="addAnother()">
              ➕ Add Another
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <span class="nav-icon">🏠</span> Home
    </a>
    <a href="my-farms.html">
      <span class="nav-icon">🌾</span> Farms
    </a>
    <a href="add-planting.html" class="active">
      <span class="nav-icon">🌱</span> Plant
    </a>
    <a href="weather.html">
      <span class="nav-icon">🌧️</span> Weather
    </a>
    <a href="#" onclick="logout(); return false;">
      <span class="nav-icon">🚪</span> Logout
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script>
    requireAuth();

    // Set default date to today
    document.getElementById('planting_date').valueAsDate = new Date();

    // Load user's farms into dropdown
    async function loadFarms() {
      const data = await apiCall('/farms/my');
      const select = document.getElementById('farm_id');

      if (data.success && data.farms.length > 0) {
        // Remove duplicates by farm_id
        const unique = [];
        const seen = new Set();
        data.farms.forEach(f => {
          if (!seen.has(f.farm_id)) {
            seen.add(f.farm_id);
            unique.push(f);
          }
        });

        select.innerHTML = unique.map(f =>
          `<option value="${f.farm_id}">${f.farm_name} — ${f.district}</option>`
        ).join('');
      } else {
        select.innerHTML = `<option value="">No farms yet — add a farm first</option>`;
      }
    }

    // Soil chip selection
    function selectSoil(type, el) {
      document.getElementById('soil_type').value = type;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    // Submit planting
    async function handleSubmit() {
      const farm_id = document.getElementById('farm_id').value;
      const yam_variety = document.getElementById('yam_variety').value;
      const planting_date = document.getElementById('planting_date').value;
      const number_of_mounds = document.getElementById('number_of_mounds').value;
      const notes = document.getElementById('notes').value;

      if (!farm_id) {
        showToast('Please select a farm', 'error'); return;
      }
      if (!planting_date) {
        showToast('Please select a planting date', 'error'); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<span class="spinner"></span> Calculating...';
      btn.disabled = true;

      try {
        const data = await apiCall('/predictions/plant', 'POST', {
          farm_id: parseInt(farm_id),
          yam_variety,
          planting_date,
          number_of_mounds: parseInt(number_of_mounds) || null,
          notes
        });

        if (data.success) {
          showToast('Harvest date predicted! 🌿');
          showPrediction(data.prediction);
        } else {
          showToast(data.message || 'Failed to save planting', 'error');
        }

      } catch (err) {
        showToast('Connection error. Is the server running?', 'error');
      }

      btn.innerHTML = '🌿 Calculate Harvest Date';
      btn.disabled = false;
    }

    function showPrediction(pred) {
      document.getElementById('predDate').textContent =
        pred.predicted_harvest_date;
      document.getElementById('predDays').textContent =
        pred.days_remaining > 0
          ? `In ${pred.days_remaining} days`
          : 'Past date — check planting date';
      document.getElementById('predConfidence').textContent =
        `${pred.confidence_percent}% Confidence`;
      document.getElementById('predBasis').textContent =
        pred.prediction_basis;

      const result = document.getElementById('predictionResult');
      result.classList.add('show');
      result.scrollIntoView({ behavior: 'smooth' });
    }

    function goToDashboard() {
      window.location.href = 'dashboard.html';
    }

    function addAnother() {
      document.getElementById('predictionResult').classList.remove('show');
      document.getElementById('number_of_mounds').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('planting_date').valueAsDate = new Date();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadFarms();
  </script>

</body>

</html>
