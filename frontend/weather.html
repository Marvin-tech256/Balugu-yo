<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather — Balugu Yo</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .page-header {
      background: linear-gradient(135deg, #1B5E20, #00897B);
      padding: 20px 24px 48px;
      color: white;
    }

    .page-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-header h1 { font-size: 20px; color: white; }

    /* District selector */
    .district-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .district-selector::-webkit-scrollbar { display: none; }

    .district-chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    .district-chip.active {
      background: white;
      color: var(--primary-dark);
      border-color: white;
      font-weight: 700;
    }

    /* Content */
    .content-area {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      margin-top: -24px;
      padding: 24px 20px 100px;
      min-height: calc(100vh - 140px);
    }

    /* Current weather card */
    .current-card {
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      border-radius: 20px;
      padding: 24px;
      color: white;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .current-temp {
      font-family: 'Poppins', sans-serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
    }

    .current-unit { font-size: 24px; font-weight: 400; }

    .current-condition {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      margin-top: 4px;
      text-transform: capitalize;
    }

    .current-location {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }

    .current-icon { font-size: 64px; }

    .current-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .detail-card {
      background: white;
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .detail-icon { font-size: 20px; margin-bottom: 4px; }

    .detail-value {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-gray);
      margin-top: 2px;
    }

    /* 7-day forecast */
    .forecast-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .forecast-scroll::-webkit-scrollbar { display: none; }

    .forecast-card {
      min-width: 80px;
      background: white;
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .forecast-card.today {
      background: var(--primary);
      color: white;
    }

    .forecast-day {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .forecast-icon { font-size: 24px; margin-bottom: 8px; }

    .forecast-temp {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .forecast-rain {
      font-size: 11px;
      margin-top: 4px;
      color: var(--accent);
    }

    .forecast-card.today .forecast-rain { color: #A5D6A7; }

    /* Impact section */
    .impact-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .impact-title {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }

    .impact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .impact-row:last-child { border-bottom: none; }

    .impact-label {
      font-size: 13px;
      color: var(--text-gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .impact-value {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .impact-good    { background: #E8F5E9; color: #2E7D32; }
    .impact-moderate{ background: #FFF8E1; color: #F57F17; }
    .impact-bad     { background: #FFEBEE; color: #C62828; }

    /* Recommendation */
    .recommendation {
      background: #FFF8E1;
      border: 1px solid #F57F17;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .recommendation-icon { font-size: 24px; flex-shrink: 0; }

    .recommendation-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    .recommendation-text strong {
      color: #F57F17;
      display: block;
      margin-bottom: 4px;
    }

    /* Section header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-header h3 {
      font-size: 16px;
      color: var(--text);
    }

    /* Loading state */
    .loading-card {
      background: white;
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      color: var(--text-gray);
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="page-header">
    <div class="page-header-top">
      <button class="back-btn" onclick="history.back()">←</button>
      <h1>🌧️ Weather Overview</h1>
    </div>

    <!-- District selector -->
    <div class="district-selector" id="districtSelector">
      <button class="district-chip active" onclick="selectDistrict('Buikwe', this)">
        Buikwe
      </button>
      <button class="district-chip" onclick="selectDistrict('Mukono', this)">
        Mukono
      </button>
      <button class="district-chip" onclick="selectDistrict('Kampala', this)">
        Kampala
      </button>
      <button class="district-chip" onclick="selectDistrict('Jinja', this)">
        Jinja
      </button>
      <button class="district-chip" onclick="selectDistrict('Mbale', this)">
        Mbale
      </button>
      <button class="district-chip" onclick="selectDistrict('Masaka', this)">
        Masaka
      </button>
    </div>
  </div>

  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Balugu <span>Yo</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="my-farms.html">
          <span class="nav-icon">🌾</span> My Farms
        </a>
        <a href="add-planting.html">
          <span class="nav-icon">🌱</span> Add Planting
        </a>
        <a href="weather.html" class="active">
          <span class="nav-icon">🌧️</span> Weather
        </a>
        <a href="alerts.html">
          <span class="nav-icon">🔔</span> Alerts
        </a>
      </nav>
      <div style="padding:20px;border-top:1px solid rgba(255,255,255,0.1)">
        <a href="#" onclick="logout()"
           style="color:rgba(255,255,255,0.6);font-size:13px">
          🚪 Logout
        </a>
      </div>
    </div>

    <div class="main-content">
      <div class="content-area" style="max-width:600px;margin:0 auto">

        <!-- Loading state -->
        <div id="loadingState" class="loading-card">
          <div style="font-size:36px;margin-bottom:12px">🌤️</div>
          <p>Loading weather data...</p>
        </div>

        <!-- Weather content -->
        <div id="weatherContent" style="display:none">

          <!-- Current weather -->
          <div class="current-card" id="currentCard">
          </div>

          <!-- Detail cards -->
          <div class="current-details" id="detailCards">
          </div>

          <!-- Recommendation -->
          <div class="recommendation" id="recommendation">
          </div>

          <!-- 7-day forecast -->
          <div class="section-header">
            <h3>7-Day Forecast</h3>
          </div>
          <div class="forecast-scroll" id="forecastScroll">
          </div>

          <!-- Impact on yams -->
          <div class="impact-card" id="impactCard">
            <div class="impact-title">🌿 Impact on Your Yams</div>
            <div id="impactRows"></div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <span class="nav-icon">🏠</span> Home
    </a>
    <a href="my-farms.html">
      <span class="nav-icon">🌾</span> Farms
    </a>
    <a href="add-planting.html">
      <span class="nav-icon">🌱</span> Plant
    </a>
    <a href="weather.html" class="active">
      <span class="nav-icon">🌧️</span> Weather
    </a>
    <a href="alerts.html">
      <span class="nav-icon">🔔</span> Alerts
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script>
    requireAuth();

    let currentDistrict = 'Buikwe';

    const weatherIcons = {
      'Clear': '☀️', 'Clouds': '⛅', 'Rain': '🌧️',
      'Drizzle': '🌦️', 'Thunderstorm': '⛈️',
      'Snow': '❄️', 'Mist': '🌫️', 'Haze': '🌫️',
      'Partly Cloudy': '⛅', 'default': '🌤️'
    };

    function getIcon(condition) {
      return weatherIcons[condition] || weatherIcons['default'];
    }

    function selectDistrict(district, el) {
      currentDistrict = district;
      document.querySelectorAll('.district-chip').forEach(c =>
        c.classList.remove('active'));
      el.classList.add('active');
      loadWeather();
    }

    async function loadWeather() {
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('weatherContent').style.display = 'none';

      try {
        // Load current weather and impact in parallel
        const [weatherData, impactData] = await Promise.all([
          apiCall(`/weather/current/${currentDistrict}`),
          apiCall(`/weather/impact/${currentDistrict}`)
        ]);

        if (weatherData.success) {
          renderCurrentWeather(weatherData.weather);
        }

        if (impactData.success) {
          renderImpact(impactData);
        }

        // Load forecast
        const forecastData = await apiCall(
          `/weather/forecast/${currentDistrict}`
        );
        if (forecastData.success) {
          renderForecast(forecastData.forecast);
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('weatherContent').style.display = 'block';

      } catch (err) {
        document.getElementById('loadingState').innerHTML = `
          <div style="font-size:36px;margin-bottom:12px">⚠️</div>
          <p>Could not load weather. Check your connection.</p>`;
      }
    }

    function renderCurrentWeather(w) {
      document.getElementById('currentCard').innerHTML = `
        <div>
          <div class="current-location">
            📍 ${currentDistrict}, Uganda
          </div>
          <div class="current-temp">
            ${w.temperature.current}<span class="current-unit">°C</span>
          </div>
          <div class="current-condition">${w.description}</div>
        </div>
        <div class="current-icon">${getIcon(w.condition)}</div>`;

      document.getElementById('detailCards').innerHTML = `
        <div class="detail-card">
          <div class="detail-icon">💧</div>
          <div class="detail-value">${w.humidity}%</div>
          <div class="detail-label">Humidity</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">🌧️</div>
          <div class="detail-value">${w.rainfall_mm}mm</div>
          <div class="detail-label">Rainfall</div>
        </div>
        <div class="detail-card">
          <div class="detail-icon">🌡️</div>
          <div class="detail-value">
            ${w.temperature.min}–${w.temperature.max}°
          </div>
          <div class="detail-label">Min–Max</div>
        </div>`;
    }

    function renderForecast(forecast) {
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      document.getElementById('forecastScroll').innerHTML =
        forecast.map((day, i) => {
          const d = new Date(day.date);
          const dayName = i === 0 ? 'Today' : days[d.getDay()];
          return `
            <div class="forecast-card ${i === 0 ? 'today' : ''}">
              <div class="forecast-day">${dayName}</div>
              <div class="forecast-icon">${getIcon(day.condition)}</div>
              <div class="forecast-temp">${day.temp_max}°</div>
              <div class="forecast-rain">🌧 ${day.rainfall_mm}mm</div>
            </div>`;
        }).join('');
    }

    function renderImpact(data) {
      const getClass = (val) => {
        if (['Good','Optimal','Low'].includes(val)) return 'impact-good';
        if (['Moderate','Normal'].includes(val)) return 'impact-moderate';
        return 'impact-bad';
      };

      if (data.impact) {
        document.getElementById('impactRows').innerHTML = `
          <div class="impact-row">
            <div class="impact-label">💧 Soil Moisture</div>
            <span class="impact-value ${getClass(data.impact.soil_moisture)}">
              ${data.impact.soil_moisture}
            </span>
          </div>
          <div class="impact-row">
            <div class="impact-label">🌱 Growth Rate</div>
            <span class="impact-value ${getClass(data.impact.growth_rate)}">
              ${data.impact.growth_rate}
            </span>
          </div>
          <div class="impact-row">
            <div class="impact-label">🐛 Pest Risk</div>
            <span class="impact-value ${getClass(data.impact.pest_risk)}">
              ${data.impact.pest_risk}
            </span>
          </div>`;

        document.getElementById('recommendation').innerHTML = `
          <div class="recommendation-icon">💡</div>
          <div class="recommendation-text">
            <strong>Harvest Recommendation</strong>
            ${data.impact.harvest_recommendation}
          </div>`;
      }
    }

    loadWeather();
  </script>

</body>
</html>
