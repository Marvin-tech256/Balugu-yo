<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Balugu Yo</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .login-hero {
      background: linear-gradient(160deg, #1B5E20, #2E7D32);
      padding: 48px 24px 64px;
      text-align: center;
      position: relative;
    }

    .login-hero h1 {
      font-size: 28px;
      color: white;
      margin-bottom: 6px;
    }

    .login-hero p {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }

    .login-hero .hero-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .login-form-card {
      background: white;
      border-radius: 24px 24px 0 0;
      margin-top: -24px;
      padding: 32px 24px;
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }

    .login-form-card h2 {
      font-size: 22px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-form-card p {
      color: var(--text-gray);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .pin-input-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .pin-box {
      width: 56px;
      height: 56px;
      border: 2px solid var(--border);
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .pin-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46,125,50,0.1);
    }

    .forgot-pin {
      text-align: right;
      margin-bottom: 24px;
    }

    .forgot-pin a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: var(--text-gray);
      font-size: 14px;
    }

    .register-link a {
      color: var(--primary);
      font-weight: 600;
    }

    .phone-input-wrap {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .phone-input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46,125,50,0.1);
    }

    .phone-prefix {
      background: var(--bg);
      padding: 13px 12px;
      font-weight: 600;
      color: var(--text);
      border-right: 1.5px solid var(--border);
      font-size: 14px;
      white-space: nowrap;
    }

    .phone-input-wrap input {
      border: none;
      outline: none;
      padding: 13px 16px;
      font-size: 15px;
      flex: 1;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

  <div class="login-hero">
    <span class="hero-icon">🌿</span>
    <h1>Welcome Back</h1>
    <p>Login to your Balugu Yo account</p>
  </div>

  <div class="login-form-card">
    <h2>Login</h2>
    <p>Enter your phone number and PIN to continue</p>

    <div class="form-group">
      <label>Phone Number</label>
      <div class="phone-input-wrap">
        <span class="phone-prefix">🇺🇬 +256</span>
        <input
          type="tel"
          id="phone"
          placeholder="700 000 000"
          maxlength="9"
        />
      </div>
    </div>

    <div class="form-group">
      <label>Your PIN</label>
      <div class="pin-input-row">
        <input type="password" maxlength="1" class="pin-box" id="p1"/>
        <input type="password" maxlength="1" class="pin-box" id="p2"/>
        <input type="password" maxlength="1" class="pin-box" id="p3"/>
        <input type="password" maxlength="1" class="pin-box" id="p4"/>
      </div>
    </div>

    <div class="forgot-pin">
      <a href="#">Forgot PIN?</a>
    </div>

    <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
      Login
    </button>

    <div class="register-link">
      New farmer? <a href="register.html">Create account</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    // Auto move to next PIN box
    document.querySelectorAll('.pin-box').forEach((box, i, boxes) => {
      box.addEventListener('input', () => {
        if (box.value && i < boxes.length - 1) {
          boxes[i + 1].focus();
        }
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && i > 0) {
          boxes[i - 1].focus();
        }
      });
    });

    async function handleLogin() {
      const phoneInput = document.getElementById('phone').value.trim();
      const pin = ['p1','p2','p3','p4'].map(id =>
        document.getElementById(id).value).join('');

      if (!phoneInput || pin.length < 4) {
        showToast('Please enter phone number and 4-digit PIN', 'error');
        return;
      }

      const phone = '+256' + phoneInput;
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="spinner"></span> Logging in...';
      btn.disabled = true;

      try {
        const data = await apiCall('/auth/login', 'POST', { phone, pin });

        if (data.success) {
          saveAuth(data.token, data.user);
          showToast('Login successful! Welcome back 🌿');
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else if (data.user.role === 'extension_officer') {
              window.location.href = 'extension-dashboard.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 1000);
        } else {
          showToast(data.message || 'Login failed', 'error');
          btn.innerHTML = 'Login';
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Connection error. Is the server running?', 'error');
        btn.innerHTML = 'Login';
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
