<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alerts — Balugu Yo</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .page-header {
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      padding: 20px 24px 48px;
      color: white;
    }

    .page-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .page-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-header h1 { font-size: 20px; color: white; }

    .mark-all-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    .tab.active {
      background: white;
      color: var(--primary-dark);
      border-color: white;
      font-weight: 700;
    }

    /* Content */
    .content-area {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      margin-top: -24px;
      padding: 24px 20px 100px;
      min-height: calc(100vh - 140px);
    }

    /* Unread count banner */
    .unread-banner {
      background: #E8F5E9;
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .unread-banner span {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }

    .unread-banner button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    /* Notification items */
    .notif-item {
      background: white;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: all 0.2s;
      position: relative;
    }

    .notif-item.unread {
      border-left: 4px solid var(--primary);
      background: #FAFFFE;
    }

    .notif-item.unread::before {
      content: '';
      position: absolute;
      top: 16px;
      right: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .notif-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-harvest  { background: #E8F5E9; }
    .icon-weather  { background: #E0F2F1; }
    .icon-warning  { background: #FFF8E1; }
    .icon-system   { background: #F3F4F6; }

    .notif-body { flex: 1; }

    .notif-title {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      padding-right: 16px;
    }

    .notif-message {
      font-size: 13px;
      color: var(--text-gray);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .notif-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notif-time {
      font-size: 11px;
      color: var(--text-gray);
    }

    .notif-actions {
      display: flex;
      gap: 8px;
    }

    .notif-btn {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: 'Poppins', sans-serif;
    }

    .btn-read {
      background: #E8F5E9;
      color: var(--primary);
    }

    .btn-dismiss {
      background: #F3F4F6;
      color: var(--text-gray);
    }

    /* Date group header */
    .date-group {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-gray);
      margin: 20px 0 10px;
    }

    /* Empty state */
    .empty-alerts {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-alerts .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-alerts h3 {
      font-size: 18px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-alerts p {
      color: var(--text-gray);
      font-size: 14px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="page-header">
    <div class="page-header-top">
      <div class="page-header-left">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>🔔 Alerts</h1>
      </div>
      <button class="mark-all-btn" onclick="markAllRead()">
        ✓ Mark all read
      </button>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="tab active" onclick="filterAlerts('all', this)">
        All
      </button>
      <button class="tab" onclick="filterAlerts('harvest', this)">
        🌿 Harvest
      </button>
      <button class="tab" onclick="filterAlerts('weather', this)">
        🌧️ Weather
      </button>
      <button class="tab" onclick="filterAlerts('warning', this)">
        ⚠️ Warnings
      </button>
      <button class="tab" onclick="filterAlerts('system', this)">
        ⚙️ System
      </button>
    </div>
  </div>

  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">Balugu <span>Yo</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="my-farms.html">
          <span class="nav-icon">🌾</span> My Farms
        </a>
        <a href="add-planting.html">
          <span class="nav-icon">🌱</span> Add Planting
        </a>
        <a href="weather.html">
          <span class="nav-icon">🌧️</span> Weather
        </a>
        <a href="alerts.html" class="active">
          <span class="nav-icon">🔔</span> Alerts
        </a>
      </nav>
      <div style="padding:20px;border-top:1px solid rgba(255,255,255,0.1)">
        <a href="#" onclick="logout()"
           style="color:rgba(255,255,255,0.6);font-size:13px">
          🚪 Logout
        </a>
      </div>
    </div>

    <div class="main-content">
      <div class="content-area" style="max-width:600px;margin:0 auto">

        <!-- Unread banner -->
        <div class="unread-banner" id="unreadBanner"
             style="display:none">
          <span id="unreadText">0 unread alerts</span>
          <button onclick="markAllRead()">Mark all as read</button>
        </div>

        <!-- Alerts list -->
        <div id="alertsList">
          <div class="empty-alerts">
            <div class="empty-icon">🔔</div>
            <h3>Loading alerts...</h3>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <span class="nav-icon">🏠</span> Home
    </a>
    <a href="my-farms.html">
      <span class="nav-icon">🌾</span> Farms
    </a>
    <a href="add-planting.html">
      <span class="nav-icon">🌱</span> Plant
    </a>
    <a href="weather.html">
      <span class="nav-icon">🌧️</span> Weather
    </a>
    <a href="alerts.html" class="active">
      <span class="nav-icon">🔔</span> Alerts
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script>
    requireAuth();

    let allAlerts = [];
    let currentFilter = 'all';

    const typeIcons = {
      harvest: { icon: '🌿', class: 'icon-harvest' },
      weather: { icon: '🌧️', class: 'icon-weather' },
      warning: { icon: '⚠️', class: 'icon-warning' },
      system:  { icon: '⚙️', class: 'icon-system'  }
    };

    async function loadAlerts() {
      // Send a test notification first if none exist
      const data = await apiCall('/alerts');

      if (!data.success) return;

      allAlerts = data.notifications;

      // Show unread banner
      if (data.unread_count > 0) {
        const banner = document.getElementById('unreadBanner');
        banner.style.display = 'flex';
        document.getElementById('unreadText').textContent =
          `${data.unread_count} unread alert${data.unread_count > 1 ? 's' : ''}`;
      }

      // If no alerts, send a welcome one
      if (allAlerts.length === 0) {
        await apiCall('/alerts/test');
        const fresh = await apiCall('/alerts');
        allAlerts = fresh.notifications || [];
      }

      renderAlerts(allAlerts);
    }

    function filterAlerts(type, el) {
      currentFilter = type;
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.remove('active'));
      el.classList.add('active');

      const filtered = type === 'all'
        ? allAlerts
        : allAlerts.filter(a => a.type === type);

      renderAlerts(filtered);
    }

    function formatTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);

      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff/60)} min ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)} hours ago`;
      if (diff < 604800) return `${Math.floor(diff/86400)} days ago`;
      return date.toLocaleDateString();
    }

    function groupByDate(alerts) {
      const groups = {};
      alerts.forEach(a => {
        const date = new Date(a.sent_at);
        const now = new Date();
        const diff = Math.floor((now - date) / 86400000);
        const key = diff === 0 ? 'Today'
          : diff === 1 ? 'Yesterday'
          : date.toLocaleDateString('en-UG', {
              weekday: 'long', month: 'short', day: 'numeric'
            });
        if (!groups[key]) groups[key] = [];
        groups[key].push(a);
      });
      return groups;
    }

    function renderAlerts(alerts) {
      const list = document.getElementById('alertsList');

      if (!alerts || alerts.length === 0) {
        list.innerHTML = `
          <div class="empty-alerts">
            <div class="empty-icon">🔔</div>
            <h3>No alerts here</h3>
            <p>You're all caught up! Alerts will appear
               here when your harvest is approaching.</p>
            <button class="btn btn-primary"
                    style="max-width:200px;margin:0 auto"
                    onclick="checkHarvest()">
              Check Harvest Alerts
            </button>
          </div>`;
        return;
      }

      const groups = groupByDate(alerts);
      let html = '';

      Object.entries(groups).forEach(([date, items]) => {
        html += `<div class="date-group">${date}</div>`;
        items.forEach(a => {
          const ti = typeIcons[a.type] || typeIcons['system'];
          html += `
            <div class="notif-item ${!a.is_read ? 'unread' : ''}"
                 id="notif-${a.notif_id}">
              <div class="notif-icon-wrap ${ti.class}">
                ${ti.icon}
              </div>
              <div class="notif-body">
                <div class="notif-title">${a.title}</div>
                <div class="notif-message">${a.message}</div>
                <div class="notif-footer">
                  <span class="notif-time">
                    🕐 ${formatTime(a.sent_at)}
                  </span>
                  <div class="notif-actions">
                    ${!a.is_read ? `
                      <button class="notif-btn btn-read"
                        onclick="markRead(${a.notif_id})">
                        ✓ Read
                      </button>` : ''}
                    <button class="notif-btn btn-dismiss"
                      onclick="deleteAlert(${a.notif_id})">
                      🗑
                    </button>
                  </div>
                </div>
              </div>
            </div>`;
        });
      });

      list.innerHTML = html;
    }

    async function markRead(id) {
      await apiCall(`/alerts/${id}/read`, 'PUT');
      const item = document.getElementById(`notif-${id}`);
      if (item) {
        item.classList.remove('unread');
        const btn = item.querySelector('.btn-read');
        if (btn) btn.remove();
        const dot = item.querySelector('::before');
        if (dot) dot.remove();
      }
      // Update the alert in array
      const alert = allAlerts.find(a => a.notif_id === id);
      if (alert) alert.is_read = true;
    }

    async function markAllRead() {
      await apiCall('/alerts/read-all', 'PUT');
      allAlerts.forEach(a => a.is_read = true);
      document.getElementById('unreadBanner').style.display = 'none';
      renderAlerts(currentFilter === 'all'
        ? allAlerts
        : allAlerts.filter(a => a.type === currentFilter));
      showToast('All alerts marked as read ✓');
    }

    async function deleteAlert(id) {
      await apiCall(`/alerts/${id}`, 'DELETE');
      allAlerts = allAlerts.filter(a => a.notif_id !== id);
      renderAlerts(currentFilter === 'all'
        ? allAlerts
        : allAlerts.filter(a => a.type === currentFilter));
      showToast('Alert dismissed');
    }

    async function checkHarvest() {
      await apiCall('/alerts/check-harvest');
      showToast('Checking harvest alerts...');
      setTimeout(loadAlerts, 1000);
    }

    loadAlerts();
  </script>

</body>
</html>
